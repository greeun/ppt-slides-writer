# ============================================
# Quarto 보고서 템플릿
# ============================================
# 용도: 비즈니스 보고서 (Quarto + Typst)
# 빌드: quarto render report.qmd --to typst
# ============================================

project:
  type: default
  output-dir: _output
  render:
    - report.qmd

# ============================================
# 전역 figure/table 설정
# ============================================
fig-width: 6
fig-height: 4
fig-align: center
tbl-cap-location: top
tbl-colwidths: false

# 이미지 페이지 넘침 방지
# Mermaid/코드 생성 이미지에 적용
execute:
  fig-width: 6
  fig-height: 7  # 최대 높이 제한 (인치)

format:
  typst:
    # ============================================
    # 출력 파일명 - 수정 필요
    # ============================================
    output-file: "output.pdf"

    # ============================================
    # 페이지 설정
    # ============================================
    papersize: a4
    margin:
      top: 30mm
      bottom: 30mm
      left: 25mm
      right: 25mm

    # ============================================
    # 폰트 설정
    # ============================================
    mainfont: "Pretendard"
    fontsize: 11pt

    # ============================================
    # 목차 - 비활성화 (cover.typ에서 직접 처리)
    # ============================================
    toc: false
    number-sections: true

    # ============================================
    # 섹션 번호
    # ============================================
    section-numbering: "1.1.1"

    # ============================================
    # 콜아웃 언어
    # ============================================
    lang: ko

    # ============================================
    # 표지 + 목차
    # ============================================
    include-before-body:
      - cover-with-toc.typ

    # ============================================
    # Typst 템플릿 (표/이미지 전역 스타일)
    # ============================================
    template-partials:
      - typst-show.typ
